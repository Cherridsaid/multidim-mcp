[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multidim-mcp"
version = "0.1.0"
description = "Structured thinking grids for AI agents - a standalone MCP server, pure standard library"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "S. Cherrid" }]
keywords = ["mcp", "model-context-protocol", "analysis", "thinking", "agents", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/Cherridsaid/multidim-mcp"
Issues = "https://github.com/Cherridsaid/multidim-mcp/issues"

[project.scripts]
multidim-mcp = "multidim_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
